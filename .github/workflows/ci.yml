name: CI

on:
  push:
    branches: [master, main, "feature/**"]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run ruff linter
        run: ruff check .
      - name: Run ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile Python files
        run: python -m compileall mcp_server.py dispatch_devin.py dispatch_skill.py workflow-engine tests
      - name: Run pytest
        run: python -m pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run bandit
        run: bandit -c .bandit.yml -r workflow-engine mcp_server.py dispatch_devin.py dispatch_skill.py install.py install_automated.py -q -x '**/test_*.py'
      - name: Run pip-audit
        run: pip-audit --desc

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel
        run: pip install dist/*.whl
      - name: Verify console scripts
        run: |
          devin-orchestrator --help
          dispatch-devin --help
          dispatch-skill --help
