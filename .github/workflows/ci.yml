name: CI

on:
  push:
    branches: [master, main, "feature/**", "refactor/**"]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run ruff linter
        run: ruff check .
      - name: Run ruff format check
        run: ruff format --check .
      - name: Run mypy on refactored modules
        run: python -m mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile Python files
        run: python -m compileall devin_orchestrator tests install.py install_automated.py
      - name: Run pytest
        run: python -m pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run bandit
        run: bandit -c .bandit.yml -r devin_orchestrator install.py install_automated.py -q -x '**/test_*.py'
      - name: Run pip-audit
        run: pip-audit --desc

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Build wheel
        run: python -m build --wheel
      - name: Install wheel
        run: pip install dist/*.whl
      - name: Verify console scripts and smoke test
        run: |
          devin-orchestrator --version
          dispatch-devin --version
          dispatch-skill --version

  install-smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Build and install wheel
        run: |
          python -m build --wheel
          pip install dist/*.whl
      - name: Verify dry-run install, uninstall, and register on ${{ matrix.os }}
        run: |
          devin-orchestrator --version
          devin-orchestrator install --dry-run
          devin-orchestrator install uninstall --deregister --dry-run
          python -m devin_orchestrator.register_mcp --dry-run
          python -m devin_orchestrator.register_mcp --snippet
