[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devin-orchestrator"
version = "0.1.2"
description = "Stateless orchestration layer for Devin workflows and skills"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Devin Orchestrator Contributors"},
]
keywords = ["devin", "orchestrator", "mcp", "workflows", "skills"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PyYAML>=5.1",
    "psutil>=5.9.0",
    "watchdog>=3.0.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "bandit>=1.7.0",
    "safety>=2.0.0",
    "pip-audit>=2.0.0",
]

[project.scripts]
devin-orchestrator = "mcp_server:main"
dispatch-devin = "dispatch_devin:main"
dispatch-skill = "dispatch_skill:main"

[project.urls]
Homepage = "https://github.com/devin-orchestrator/devin-orchestrator"
Documentation = "README.md"

[tool.hatch.build]
ignore-vcs = true
exclude = [
    ".git",
    ".github",
    ".devin",
    ".windsurf",
    ".windsurf/cache",
    ".windsurf/index",
    ".pytest_cache",
    "**/__pycache__",
    "**/*.egg-info",
    "build",
    "dist",
    "tests",
    "work",
    "logs",
    "archive",
    "sessions",
    "**/test_*.py",
    "devin_orchestrator/skills",
    "devin_orchestrator/logs",
    "devin_orchestrator/work",
]

[tool.hatch.build.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["devin_orchestrator"]

[tool.hatch.build.targets.wheel.force-include]
"mcp_server.py" = "mcp_server.py"
"dispatch_devin.py" = "dispatch_devin.py"
"dispatch_skill.py" = "dispatch_skill.py"
"bootstrap_path.py" = "bootstrap_path.py"
"skills" = "skills"
"workflows" = "workflows"
"roles" = "roles"
"config.yaml" = "config.yaml"
"config.yaml.template" = "config.yaml.template"
