[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devin-orchestrator"
version = "0.1.2"
description = "Stateless orchestration layer for Devin workflows and skills"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Devin Orchestrator Contributors"},
]
keywords = ["devin", "orchestrator", "mcp", "workflows", "skills"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "PyYAML>=5.1",
    "psutil>=5.9.0",
    "watchdog>=3.0.0",
    "requests>=2.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "pip-audit>=2.0.0",
    "build>=1.0.0",
]

[project.scripts]
devin-orchestrator = "devin_orchestrator.mcp_server:main"
dispatch-devin = "devin_orchestrator.dispatch_devin:main"
dispatch-skill = "devin_orchestrator.dispatch_skill:main"

[project.urls]
Homepage = "https://github.com/emiltsoi/devin-orchestrator"
Documentation = "README.md"

[tool.hatch.build]
ignore-vcs = true
exclude = [
    ".git",
    ".github",
    ".devin",
    ".windsurf",
    ".windsurf/cache",
    ".windsurf/index",
    ".pytest_cache",
    ".ruff_cache",
    ".coverage",
    ".coverage.*",
    ".venv",
    ".venv-review",
    ".venv-ci",
    "**/__pycache__",
    "**/*.egg-info",
    "build",
    "dist",
    "tests",
    "work",
    "logs",
    "archive",
    "sessions",
    "**/test_*.py",
    "devin_orchestrator/logs",
    "devin_orchestrator/work",
]

[tool.hatch.build.targets.wheel]
packages = ["devin_orchestrator"]

[tool.mypy]
files = ["."]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
